name: CI pour la branche develop

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  compute:
    uses: ./.github/workflows/compute-version.yml
    secrets: inherit

  build:
    name: DuckDB Integration
    runs-on: ubuntu-latest
    needs: compute
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: opt-nc/setup-duckdb-action@v1.2.6
      - uses: schemacrawler/SchemaCrawler-Action@v17.11.1

      - name: Load DuckDB database
        run: |
          mkdir dist
          duckdb dist/ref-metiers-opt-nc.duckdb < src/duck.sql

      - name: Download DuckDB JDBC driver (musl/Alpine)
        run: |
          mkdir -p .github/schemacrawler/lib
          curl -L "https://repo1.maven.org/maven2/org/duckdb/duckdb_jdbc/1.4.1.0/duckdb_jdbc-1.4.1.0-linux_amd64_musl.jar" \
            -o .github/schemacrawler/lib/duckdb_jdbc.jar
    
      - name: Run SchemaCrawler Action with specified command-line
        uses: schemacrawler/SchemaCrawler-Action@v17.11.1
        with:
          entrypoint: /schemacrawler.sh
          args: >
            --config-file=etc/schemacrawler.config.properties  \
            --command=schema \
            --info-level=standard \
            --driver=org.duckdb.DuckDBDriver \
            --url=jdbc:duckdb:/github/workspace/dist/ref-metiers-opt-nc.duckdb \
            --table-types=TABLE \
            --output-format=png \
            --output-file=/github/workspace/dist/ref-metiers-opt-nc.png

      - name: update output repository and push to develop
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UNIQUE_BRANCH="${{ needs.compute.outputs.unique_branch }}"
          NEW="${{ needs.compute.outputs.new_version }}"
          
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin
          git checkout -b $UNIQUE_BRANCH
          git merge origin/main --no-edit || true
          
          git add -f data/output/about.csv
          git add -f data/output/categorie_detention.csv
          git add -f data/output/competence.csv
          git add -f data/output/competence_utilisateur.csv
          git add -f data/output/famille_metier.csv
          git add -f data/output/gem_competence.csv
          git add -f data/output/gem_metier.csv
          git add -f data/output/gem_metier_competence.csv
          git add -f data/output/groupe_competence.csv
          git add -f data/output/metier.csv
          git add -f data/output/metier_competence.csv
          git add -f data/output/niveau_description_competence.csv
          git add -f data/output/referentiel_competence.csv
          git add -f data/output/sous_famille_metier.csv
          git add -f data/output/statut_metier.csv
          git commit -m "Updated output's files"
          git push origin $UNIQUE_BRANCH

          gh pr create --head $UNIQUE_BRANCH --base develop --title "Updated develop branch's output's files" --body "Cette Pull Request a été générée automatiquement par la CI. Elle contient les fichiers CSV mis à jour."
          gh pr merge $UNIQUE_BRANCH --merge --delete-branch
          gh release create $NEW --title "prerelease $NEW" --notes "Mise à jour automatique du référentiel d'export des métiers." --target develop dist/ref-metiers-opt-nc.duckdb dist/ref-metiers-opt-nc.sqlite dist/ref-metiers-opt-nc-schemacrawler.png
